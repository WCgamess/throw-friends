<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throw Friends</title>
<link rel="icon" href="icon.png">
<style>
  :root{--bg:#F4F8FC;--card:#fff;--text:#1E2A36;--muted:#5B6B7B;--accent:#2E80CC;--line:#D9E3EC}
  @media (prefers-color-scheme:dark){:root{--bg:#0F1720;--card:#17212C;--text:#E6EDF3;--muted:#9AAAB8;--accent:#6CB4F0;--line:#2A3846}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  main{max-width:560px;margin:0 auto;padding:48px 16px;text-align:center}
  img{width:128px;height:128px;border-radius:28px;border:1px solid var(--line)}
  h1{font-size:30px;margin:16px 0 8px}
  p{margin:10px 0}
  .muted{color:var(--muted);font-size:14px}
  a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Throw Friends">
  <h1>Throw Friends</h1>
  <p>Metti la faccia dei tuoi amici sull'omino e lancialo più lontano che puoi!</p>
  <p class="muted" lang="en">Put your friends' faces on the guy and launch him as far as you can!</p>
  <p><a href="privacy.html">Informativa sulla privacy · Privacy Policy</a></p>
  <p class="muted">WC Games · <a href="mailto:wcgames.support@gmail.com">wcgames.support@gmail.com</a></p>
</main>
</body>
</html>
